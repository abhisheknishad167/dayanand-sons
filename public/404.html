<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8f341d">
  <title>Page not found | Dayanand &amp; Sons</title>
  <link rel="icon" type="image/svg+xml" href="/dayanand-sons/ds-favicon.svg">
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #1c1c18; background: #fcf9f3; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px 20px; }
    main { width: min(100%, 680px); padding: 56px; border-top: 4px solid #8f341d; background: #fff; box-shadow: 0 20px 60px rgba(28,28,24,.08); }
    .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 64px; color: #1c1c18; font: 700 19px Georgia, serif; letter-spacing: .07em; text-transform: uppercase; }
    .mark { display: grid; place-items: center; width: 50px; height: 50px; background: #8f341d; color: #f5f2ea; font: 700 20px Georgia, serif; }
    .eyebrow { color: #8f341d; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 18px 0; font: 700 clamp(38px, 8vw, 64px)/1.08 Georgia, serif; }
    p { max-width: 480px; color: #56423d; font-size: 17px; line-height: 1.6; }
    a.button { display: inline-flex; align-items: center; min-height: 48px; margin-top: 20px; padding: 0 24px; background: #8f341d; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
    a.button:focus-visible { outline: 3px solid #d4af37; outline-offset: 3px; }
    @media (max-width: 560px) { main { padding: 36px 24px; } .brand { margin-bottom: 48px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">D&amp;S</span><span>Dayanand &amp; Sons</span></div>
    <p class="eyebrow">Error 404</p>
    <h1>This page isn't on the plans.</h1>
    <p>The page may have moved or the address may be incorrect. Return to the home page to explore our work.</p>
    <a class="button" href="/dayanand-sons/">Back to home</a>
  </main>
</body>
</html>
